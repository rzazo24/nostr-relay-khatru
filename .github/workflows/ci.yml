name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Build, vet & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=1 go build ./...
      - run: CGO_ENABLED=1 go vet ./...
      - run: CGO_ENABLED=1 go test ./... -v

  vulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=1 go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  smoke-test:
    name: End-to-end smoke test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build relay
        run: CGO_ENABLED=1 go build -o nostr-relay-khatru-ci .

      - name: Start relay in the background
        run: |
          RELAY_DB_PATH="$RUNNER_TEMP/ci.sqlite" RELAY_LISTEN_ADDR=:3334 \
          RELAY_EVENTS_PER_MINUTE=1000 RELAY_EVENTS_BURST=1000 \
          RELAY_REQS_PER_MINUTE=1000 RELAY_REQS_BURST=1000 \
            ./nostr-relay-khatru-ci > "$RUNNER_TEMP/relay.log" 2>&1 &

          for i in $(seq 1 20); do
            if curl -sf -H "Accept: application/nostr+json" http://localhost:3334/ > /dev/null; then
              echo "relay is up"
              exit 0
            fi
            sleep 0.5
          done

          echo "relay did not become ready in time" >&2
          cat "$RUNNER_TEMP/relay.log" >&2
          exit 1

      - name: Check --healthcheck subcommand
        run: RELAY_LISTEN_ADDR=:3334 ./nostr-relay-khatru-ci --healthcheck

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: test
        run: npm ci

      - name: Run smoke test
        working-directory: test
        env:
          RELAY_URL: ws://localhost:3334
        run: npm test

      - name: Show relay logs
        if: always()
        run: cat "$RUNNER_TEMP/relay.log" || true

  panel-test:
    name: Control panel end-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build relay
        run: CGO_ENABLED=1 go build -o nostr-relay-khatru .

      - name: Install test dependencies and Chromium
        working-directory: test/panel
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run panel tests
        working-directory: test/panel
        env:
          RELAY_BIN: ../../nostr-relay-khatru
        run: npm test
